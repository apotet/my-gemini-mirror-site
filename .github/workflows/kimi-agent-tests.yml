name: Kimi offline tests
on:
  pull_request:
    paths: ['.github/scripts/**', '.github/agent/**', '.github/agent-tasks/**', '.github/workflows/kimi-agent*', '.github/workflows/kimi-issue.yml', 'tests/**']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tests/vendor --no-save --ignore-scripts typescript@5.9.3
      - run: python3 tests/test_offline.py
      - run: python3 tests/test_agent_tools.py
      - run: python3 tests/test_agent_security.py
      - run: python3 tests/test_kimi_issue.py

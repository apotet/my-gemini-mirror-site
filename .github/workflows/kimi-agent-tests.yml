name: Agent runtime offline tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/agent_runtime/**'
      - '.github/scripts/**'
      - '.github/agent/**'
      - '.github/workflows/agent-task.yml'
      - '.github/workflows/*-issue.yml'
      - '.github/workflows/kimi-agent*'
      - 'scripts/zai*'
      - 'tests/**'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix scripts/zai-runtime
      - run: python3 tests/test_agent_runtime.py
      - run: python3 scripts/gemini-issue-agent.test.py
      - run: node scripts/zai-lesson-resolver.test.mjs
  sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trusted credential-free isolation image
        run: docker build -t netops-agent-checks:local .github/agent_runtime
      - name: Real sandbox isolation smoke (no model, no GitHub write token)
        run: python3 tests/agent_sandbox_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reviewed host toolchain (no candidate lifecycle hooks)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full isolated baseline checks (no model transport)
        run: python3 tests/agent_sandbox_integration.py

name: Kimi offline tests
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/scripts/**', '.github/agent/**', '.github/agent-tasks/**', '.github/workflows/kimi-agent*', '.github/workflows/kimi-issue.yml', 'tests/**']
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tests/vendor --no-save --ignore-scripts typescript@5.9.3
      - run: python3 tests/test_offline.py
      - run: python3 tests/test_agent_tools.py
      - run: python3 tests/test_agent_security.py
      - run: python3 tests/test_kimi_issue.py

  publication-diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' && github.actor == 'apotet' &&
      github.repository == 'apotet/my-gemini-mirror-site' &&
      github.ref == 'refs/heads/fix/kimi-pr-publication'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Diagnose PR publication policy using existing verified Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kimi_publication_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kimi-publication-diagnostic
          path: out/publication-probe.json
          retention-days: 30

name: Gemini DEV synthetic one-shot pilot
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type one-synthetic-request after review and budget approval'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  pilot:
    if: >-
      github.repository == 'apotet/my-gemini-mirror-site' && github.actor == 'apotet' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      inputs.confirmation == 'one-synthetic-request' &&
      vars.NETOPS_GEMINI_PILOT_ENABLED == 'true' &&
      vars.NETOPS_GEMINI_DEV_PROVIDER_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: gemini-dev-synthetic-pilot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install trusted validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build isolation image
        run: docker build -t netops-agent-checks:local .github/agent_runtime
      - name: Single synthetic request and checked Draft PR
        env:
          PYTHONPATH: .github
          GH_TOKEN: ${{ github.token }}
          PROVIDER_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NETOPS_GEMINI_PILOT_ENABLED: ${{ vars.NETOPS_GEMINI_PILOT_ENABLED }}
          NETOPS_GEMINI_DEV_PROVIDER_VERIFIED: ${{ vars.NETOPS_GEMINI_DEV_PROVIDER_VERIFIED }}
        run: python3 -m agent_runtime.pilot

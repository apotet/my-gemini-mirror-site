name: Understanding strict closeout acceptance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/load-bank.mjs'
      - 'scripts/in-depth-entry.ts'
      - 'scripts/in-depth-review-fingerprint.mjs'
      - 'scripts/in-depth-review-policy.mjs'
      - 'scripts/in-depth-review-policy.test.mjs'
      - 'docs/audits/in-depth/closeout-acceptance-*.json'
      - 'docs/audits/in-depth/final-review-*.json'
      - '.github/workflows/understanding-fingerprint-policy.yml'

jobs:
  fingerprint-policy:
    name: Strict registry, content, history, typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-fund --no-audit
      - name: Verify historical and closeout fail-closed cases
        run: node scripts/in-depth-review-policy.test.mjs
      - name: Verify exact 164-ID acceptance (strict, no report-only)
        run: node scripts/in-depth-review-fingerprint.mjs
      - name: Verify Understanding content contracts
        run: npm run test:in-depth
      - name: Verify historical answers and saved attempts
        run: npm run test:in-depth-history
      - name: Typecheck and production-mode build (no deploy)
        run: npm run lint && npm run build
      - name: Upload strict acceptance and separate historical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: understanding-closeout-acceptance
          path: scripts/.cache/in-depth/semantic-freeze-report.json
          if-no-files-found: warn

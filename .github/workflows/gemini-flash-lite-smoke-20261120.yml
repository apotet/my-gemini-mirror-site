name: One-shot Gemini 3.5 Flash Lite control diagnostic (not NetOps audit)
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/gemini-flash-lite-smoke-20261120.yml'
permissions:
  contents: read
jobs:
  minimal-control:
    if: >-
      github.repository == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.repo.full_name == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'audit/gemini-flash-lite-smoke-20261120' &&
      github.event.pull_request.user.login == 'apotet'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: One single generation call to Flash Lite (not Hydrogen)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'No API secret'; exit 1; }
          node --input-type=module <<'NODE'
          const model='gemini-3.5-flash-lite',start=Date.now();
          try {
            const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{
              method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':process.env.GEMINI_API_KEY},
              body:JSON.stringify({
                contents:[{role:'user',parts:[{text:'Return exactly PONG.'}]}],
                generationConfig:{maxOutputTokens:128}
              }),
              signal:AbortSignal.timeout(45000)
            });
            const p=await r.json().catch(()=>({}));
            console.log('CONTROL_MODEL',model,'HTTP',r.status,'latency_ms',Date.now()-start);
            if(!r.ok){console.log('API_ERROR',String(p.error?.status||'UNKNOWN'),String(p.error?.message||'').replace(/AIza[A-Za-z0-9_-]{15,}/g,'[REDACTED]').slice(0,200));process.exitCode=1;}
            else{
              const c=p.candidates?.[0],out=(c?.content?.parts||[]).filter(x=>typeof x.text==='string').map(x=>x.text).join('');
              console.log('MODEL_OUTPUT',JSON.stringify(out.slice(0,140)),'FINISH',c?.finishReason||'UNKNOWN');
              console.log('API_USAGE',JSON.stringify(p.usageMetadata||{}));
              if(!out.trim())process.exitCode=2; else console.log('CONTROL_GENERATION_SUCCESS');
            }
          }catch(e){console.log('CONTROL_TRANSPORT_ERROR',e.name,String(e.cause?.code||''));process.exitCode=3;}
          NODE

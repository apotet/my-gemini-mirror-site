name: Gemini Designer offline guard
on:
  pull_request:
    paths:
      - '.github/agent_runtime/**'
      - '.github/agent/gemini-designer-requirements.lock'
      - '.github/workflows/gemini-designer-*.yml'
      - 'tests/test_gemini_designer*.py'
      - 'docs/design-evidence/gemini-arp-v1/**'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .github
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install hash-locked binary dependency
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all:
          --no-deps -r .github/agent/gemini-designer-requirements.lock
      - name: Local images and mocked transports only
        run: |
          python -c 'import PIL; assert PIL.__version__ == "13.0.0"'
          python -m unittest discover -s tests -p 'test_gemini_designer*.py' -v

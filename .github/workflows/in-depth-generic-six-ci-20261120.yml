name: NetOps Understanding six generic content FIX gates (read only)
on:
  pull_request:
    types: [opened, synchronize]
    branches: [audit/gemini-batch03-50-fixes-20261120]
    paths:
      - 'src/data/inDepth/specificPracticalTips.ts'
      - 'src/data/inDepth/group2.ts'
      - 'src/data/inDepth/group3.ts'
      - 'src/data/lessons/existingUnderstandingHeadings.ts'
      - 'scripts/in-depth-six-generic-audit.mjs'
      - '.github/workflows/in-depth-generic-six-ci-20261120.yml'
permissions:
  contents: read
jobs:
  fixed-six:
    if: >-
      github.repository == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.repo.full_name == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.ref == 'audit/understanding-new4-fixes-20261120' &&
      github.event.pull_request.base.ref == 'audit/gemini-batch03-50-fixes-20261120' &&
      github.event.pull_request.user.login == 'apotet'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Six original question keys, current tips, HTTP trap and linked two-style sections
        run: node scripts/in-depth-six-generic-audit.mjs
      - name: Preserve full bank and historical sessions
        run: |
          npm run test:in-depth
          npm run test:in-depth-history
      - name: Lint and build for local browser only
        run: |
          npm run lint
          npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Browser test six questions, exact lesson anchors and return, 375 and 1440
        env:
          NETOPS_L2_IDS: l3-16,new-ts-photo-panel,review-dot1x-20,review-ospf-27,l7-new-04,l3-d07
        run: |
          npm run preview -- --host 127.0.0.1 --port 5428 --strictPort >/tmp/netops-generic6-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5428/my-gemini-mirror-site/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5428/my-gemini-mirror-site/ >/dev/null
          node scripts/in-depth.browser.mjs
      - name: Retain source packs and browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-generic-source-and-chromium
          path: |
            scripts/.cache/in-depth/six-generic-source.json
            scripts/.cache/in-depth/browser/shard-0-of-1/
          if-no-files-found: warn

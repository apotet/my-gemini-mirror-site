name: OpenCode CLI smoke (no model)
on:
  pull_request:
    paths:
      - '.github/workflows/opencode-*.yml'
      - 'scripts/opencode_audit.py'
      - 'scripts/opencode_control.cjs'
      - 'tests/opencode_control.test.cjs'
      - 'tests/test_opencode_audit.py'
permissions:
  contents: read
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline command authorization tests (no model or GitHub calls)
        run: node --test tests/opencode_control.test.cjs
      - name: Offline runner regression tests
        run: python3 -m unittest discover -s tests -p test_opencode_audit.py
      - name: Install official pinned CLI without credentials
        run: npm install --global opencode-ai@1.19.6
      - name: Verify real CLI version and command availability (no model request)
        run: |
          test "$(opencode --version)" = '1.19.6'
          opencode run --help > /dev/null
          ZHIPU_API_KEY=opencode-catalog-placeholder opencode models zai > "$RUNNER_TEMP/zai-models.txt"
          grep -Fx "zai/glm-5.3" "$RUNNER_TEMP/zai-models.txt"
      - name: Verify refreshed Coding Plan catalog (no model request)
        run: |
          ZHIPU_API_KEY=opencode-catalog-placeholder opencode models zai-coding-plan --refresh > "$RUNNER_TEMP/zai-coding-plan-models.txt"
          grep -Fx "zai-coding-plan/glm-5.4" "$RUNNER_TEMP/zai-coding-plan-models.txt"
      - name: Dry-run both model configurations (no CLI invocation)
        run: |
          python3 scripts/opencode_audit.py --model glm-5.4 --output "$RUNNER_TEMP/dry-54"
          python3 scripts/opencode_audit.py --model glm-5.3 --output "$RUNNER_TEMP/dry-53"
          python3 scripts/opencode_audit.py --provider zai --model glm-5.3 --output "$RUNNER_TEMP/dry-api53"
      - name: Checkout main for audit dry-run
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: audit-main
          persist-credentials: false
      - name: Checkout pinned source for audit dry-run
        uses: actions/checkout@v4
        with:
          ref: 491dfd894f229239eb54011f5970fd3b5b45263e
          path: audit-pin
          persist-credentials: false
      - name: Validate main and pinned source, reject invalid targets without model calls
        env:
          MAIN_SHA: ${{ github.event.pull_request.base.sha }}
          PIN_SHA: 491dfd894f229239eb54011f5970fd3b5b45263e
          SOURCE: docs/audits/applied-l3-20261124/batch-01-source.json
        run: |
          runner=scripts/opencode_audit.py
          python3 "$runner" --repo audit-main --expected-sha "$MAIN_SHA" --output "$RUNNER_TEMP/audit-main"
          python3 "$runner" --repo audit-pin --expected-sha "$PIN_SHA" --source "$SOURCE" --output "$RUNNER_TEMP/audit-pin"
          mkdir "$RUNNER_TEMP/no-model"
          printf '#!/bin/sh\ntouch "$(dirname "$0")/called"\nexit 99\n' > "$RUNNER_TEMP/no-model/opencode"
          chmod +x "$RUNNER_TEMP/no-model/opencode"
          export PATH="$RUNNER_TEMP/no-model:$PATH"
          export ZHIPU_API_KEY=non-secret-test-placeholder
          for sha in '' invalid 0000000000000000000000000000000000000000; do
            if python3 "$runner" --paid --repo audit-pin --expected-sha "$sha" --source "$SOURCE"; then
              echo "Invalid audit target accepted"
              exit 1
            fi
          done
          if python3 "$runner" --paid --repo audit-pin --expected-sha "$PIN_SHA" --source missing.json; then
            echo "Missing audit source accepted"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/no-model/called"

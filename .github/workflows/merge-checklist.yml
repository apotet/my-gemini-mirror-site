name: Merge readiness checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  checklist:
    name: Checklist gate
    runs-on: ubuntu-latest
    steps:
      - name: Validate content checklist only for learning-content PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            // Scope this checklist to actual educational content, not UI/CLI/bugfix PRs.
            // Keep the path rules explicit and review them when new content sources appear.
            const contentPaths = [
              /^src\/data\/(?:questions|questionExplanations|lessons|glossary|practiceLinks)/,
              /^src\/data\/questionLearningLevels\.json$/,
              /^docs\/LEARNING_CONTENT_STANDARD\.md$/,
            ];
            const changed = files.map(file => file.filename);
            const learningContent = changed.filter(path => contentPaths.some(rule => rule.test(path)));
            if (!learningContent.length) {
              core.info('Not a learning-content PR; content-specific GATE-01..10 are not applicable.');
              return;
            }
            core.info('Learning-content files: ' + learningContent.join(', '));
            const body = pr.body || '';
            const missing = [];
            for (let i = 1; i <= 10; i++) {
              const id = 'GATE-' + String(i).padStart(2, '0');
              const line = body.split(/\r?\n/).find(s => s.includes('[' + id + ']'));
              if (!line || !/^\s*- \[x\] \[GATE-\d{2}\]/i.test(line)) missing.push(id);
            }
            if (missing.length) core.setFailed('Learning-content PR: unconfirmed checks: ' + missing.join(', '));
            else core.info('All ten learning-content checklist items confirmed; other tests and review remain required.');

name: Gemini Designer Free tier
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Use smoke first. Pilot: only after verifying visual smoke.'
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - pilot
      free_project:
        description: 'If AI Studio shows Free tier for the project behind this same GEMINI_API_KEY, type same-key-project-is-free-tier'
        type: string
        required: true
permissions:
  contents: read
jobs:
  comment-gate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'apotet/my-gemini-mirror-site' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '332418397' && github.run_attempt == 1 &&
      github.event.issue.number == 591 && !github.event.issue.pull_request &&
      (github.event.comment.body == '/gennady check' ||
       github.event.comment.body == '/gennady smoke' ||
       github.event.comment.body == '/gennady retry-503' ||
       github.event.comment.body == '/gennady pilot-tcpip' ||
       github.event.comment.body == '/gennady accept-tcpip' ||
       github.event.comment.body == '/gennady retry-visual-503' ||
       github.event.comment.body == '/gennady accept-tcpip-structured')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.guard.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: guard
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const { authorize } = require('./scripts/gemini_designer_comment.cjs');
            const mode = authorize(context, process.env.GITHUB_RUN_ATTEMPT, process.env.TRIGGERING_ACTOR);
            if (!mode) throw new Error('Command rejected');
            core.setOutput('mode', mode);
            if (mode === 'probe') core.notice('GitHub command verified. No Google request or provider secret.');

  comment-reservation:
    needs: comment-gate
    if: needs.comment-gate.outputs.mode == 'smoke' || needs.comment-gate.outputs.mode == 'retry-503' || (needs.comment-gate.outputs.mode == 'pilot' || (needs.comment-gate.outputs.mode == 'acceptance' || needs.comment-gate.outputs.mode == 'retry-visual' || needs.comment-gate.outputs.mode == 'structured-visual'))
    permissions:
      contents: read
      issues: write
    concurrency:
      group: gemini-designer-free-smoke-reservation
      cancel-in-progress: false
    outputs:
      receipt: ${{ steps.reserve.outputs.receipt }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: reserve
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const { reserveSmoke } = require('./scripts/gemini_designer_comment.cjs');
            if (!await reserveSmoke(github, context, process.env.GITHUB_RUN_ATTEMPT, process.env.TRIGGERING_ACTOR))
              throw new Error('No valid Free-tier attestation or smoke was already reserved');
            core.setOutput('receipt', [process.env.GITHUB_RUN_ID, context.payload.comment.id].join(':'));

  public-arp:
    needs: [comment-gate, comment-reservation]
    if: >-
      always() && !cancelled() &&
      github.repository == 'apotet/my-gemini-mirror-site' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'apotet' && github.triggering_actor == 'apotet' &&
      github.actor_id == '332418397' && github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.free_project == 'same-key-project-is-free-tier' &&
        (inputs.mode == 'smoke' || inputs.mode == 'pilot')) ||
       (github.event_name == 'issue_comment' &&
        (needs.comment-gate.outputs.mode == 'smoke' || needs.comment-gate.outputs.mode == 'retry-503' || (needs.comment-gate.outputs.mode == 'pilot' || (needs.comment-gate.outputs.mode == 'acceptance' || needs.comment-gate.outputs.mode == 'retry-visual' || needs.comment-gate.outputs.mode == 'structured-visual'))) &&
        needs.comment-reservation.result == 'success' &&
        needs.comment-reservation.outputs.receipt != ''))
    concurrency:
      group: gemini-designer-free
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install hash-locked binary dependency without provider key
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all:
          --no-deps -r .github/agent/gemini-designer-requirements.lock
      - name: Analyze checked-in public screenshots with fixed Free-tier model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DESIGNER_COMMENT_RESERVATION: ${{ needs.comment-reservation.outputs.receipt }}
          DESIGN_MODE: ${{ github.event_name == 'issue_comment' && ((needs.comment-gate.outputs.mode == 'acceptance' || needs.comment-gate.outputs.mode == 'retry-visual' || needs.comment-gate.outputs.mode == 'structured-visual') && 'acceptance' || needs.comment-gate.outputs.mode == 'pilot' && 'pilot' || 'smoke') || inputs.mode }}
          PYTHONPATH: .github
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          umask 077
          python -m agent_runtime.designer_free --mode "$DESIGN_MODE" --report "$RUNNER_TEMP/gemini-designer-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-designer-public-result
          path: ${{ runner.temp }}/gemini-designer-result.json
          if-no-files-found: error
          retention-days: 7

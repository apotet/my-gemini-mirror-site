name: NetOps Understanding semantic fingerprint triage (read only)
on:
  pull_request:
    types: [opened, synchronize]
    branches: [audit/gemini-batch03-50-fixes-20261120]
    paths:
      - 'scripts/in-depth-fingerprint-triage.mjs'
      - 'scripts/in-depth-local-impact-triage.mjs'
      - 'scripts/in-depth-six-generic-audit.mjs'
      - '.github/workflows/in-depth-fingerprint-triage-20261120.yml'
permissions:
  contents: read
jobs:
  explain-fingerprint-delta:
    if: >-
      github.repository == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.repo.full_name == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.ref == 'audit/understanding-new4-fixes-20261120' &&
      github.event.pull_request.base.ref == 'audit/gemini-batch03-50-fixes-20261120' &&
      github.event.pull_request.user.login == 'apotet'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compute exact semantic materials from old and current SHA
        run: bash scripts/in-depth-material-delta.sh
      - name: Classify differences without changing accepted fingerprints
        run: node scripts/in-depth-fingerprint-triage.mjs
      - name: Separate direct question and exact section deltas from shared lesson/glossary ripple
        run: node scripts/in-depth-local-impact-triage.mjs
      - name: Extract six detected generic advice cases with full source context
        run: node scripts/in-depth-six-generic-audit.mjs
      - name: Export audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: understanding-semantic-fingerprint-triage
          path: |
            scripts/.cache/in-depth/local-impact-triage.json
            scripts/.cache/in-depth/six-generic-source.json
            scripts/.cache/in-depth/fingerprint-triage.json
            scripts/.cache/in-depth/semantic-material-delta.json
          if-no-files-found: warn

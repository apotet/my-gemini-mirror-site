name: NetOps Understanding four transferred ID source audit pack (read-only)
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - audit/fix-gemini30-nine-20261120
    paths:
      - 'scripts/in-depth-four-new-audit-pack.mjs'
      - '.github/workflows/in-depth-four-new-pack-20261120.yml'
permissions:
  contents: read
jobs:
  source-pack:
    if: >-
      github.repository == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.repo.full_name == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.ref == 'audit/gemini-batch03-50-fixes-20261120' &&
      github.event.pull_request.base.ref == 'audit/fix-gemini30-nine-20261120' &&
      github.event.pull_request.user.login == 'apotet'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies without lifecycle
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export exact four question packs for external engineering inspection
        run: node scripts/in-depth-four-new-audit-pack.mjs
      - name: Retain inspectable JSON
        uses: actions/upload-artifact@v4
        with:
          name: four-transferred-independent-audit-pack
          path: scripts/.cache/in-depth/four-new-independent-audit.json
          if-no-files-found: error

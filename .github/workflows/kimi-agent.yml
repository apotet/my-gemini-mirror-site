name: Kimi Agent
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Optional full v2 JSON task or {"resume":{...}}; overrides legacy fields'
        type: string
        default: ''
      mode:
        type: choice
        options: [audit-only, edit]
        default: audit-only
      task_file:
        type: string
        default: '.github/agent-tasks/poe-injectors-fix.md'
      target_files:
        type: string
        default: 'src/data/lessons/l1-poe-injectors-splitters.ts'
      verification:
        type: choice
        options: [structure, poe-full]
        default: structure
      max_tokens:
        description: 'Optional coordinator choice; blank = full model-native maximum'
        type: string
        default: ''
      max_calls:
        description: 'Finite call grant for this activation; exhausted tasks checkpoint, never loop forever'
        type: string
        default: '8'
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
jobs:
  task:
    if: github.actor == 'apotet' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    uses: ./.github/workflows/agent-task.yml
    with:
      provider: kimi
    secrets:
      PROVIDER_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}

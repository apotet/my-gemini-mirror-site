name: One-shot Gemini content review for PR 264 (staging only)

on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/gemini-audit-once-pr264.yml'

permissions:
  contents: read

jobs:
  independent-audit:
    if: >-
      github.repository == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.repo.full_name == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'audit/gemini-pr264-once-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require target PR 264 to remain at audited commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTUAL=$(gh api "repos/$GITHUB_REPOSITORY/pulls/264" --jq '.head.sha')
          test "$ACTUAL" = 'c7ca35f7c747f93f827089bc97464c4d965c6834' || { echo 'Target PR head drifted: do not call Gemini'; exit 1; }

      - name: Trusted reviewer scripts from staging main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Audited PR snapshot (no credentials)
        uses: actions/checkout@v4
        with:
          ref: c7ca35f7c747f93f827089bc97464c4d965c6834
          path: subject
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install content extraction dependency without lifecycle hooks
        working-directory: subject
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Freeze two explicit four-ID source packs at exact SHA
        run: |
          node trusted/scripts/gemini-audit-pack.mjs subject \
            'gap-pack2-05,gap-pack2-10,gap-pack2-11,gap-pack2-16' audit-pack/first.json
          node trusted/scripts/gemini-audit-pack.mjs subject \
            'gap-pack2-21,gap-pack3-08,gap-pack3-12,gen-diag-0' audit-pack/second.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('audit-pack/first.json'));
          const b=JSON.parse(readFileSync('audit-pack/second.json'));
          assert.equal(a.sha,'c7ca35f7c747f93f827089bc97464c4d965c6834');
          assert.equal(b.sha,a.sha);
          assert.equal(a.ids.length,4);
          assert.equal(b.ids.length,4);
          assert.equal(new Set([...a.ids,...b.ids]).size,8);
          assert.ok([...a.records,...b.records].every(r=>r.materialHash.length===64));
          NODE

      - name: FIRST bounded Gemini API call (no retries)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-4-hydrogen
        run: node trusted/scripts/gemini-audit-review.mjs audit-pack/first.json audit-output/first.md audit-output/first.json

      - name: Verify exact PR SHA before posting first report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTUAL=$(gh api "repos/$GITHUB_REPOSITORY/pulls/264" --jq '.head.sha')
          test "$ACTUAL" = 'c7ca35f7c747f93f827089bc97464c4d965c6834' || { echo 'PR changed, refuse stale advisory report'; exit 1; }

      - name: Post first read-only advisory to target PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 264 --repo "$GITHUB_REPOSITORY" --body-file audit-output/first.md
          cat audit-output/first.md >> "$GITHUB_STEP_SUMMARY"

      - name: Permit next batch only after exact four rigorous PASS
        id: first-gate
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('audit-output/first.json','utf8'));
          const ids=['gap-pack2-05','gap-pack2-10','gap-pack2-11','gap-pack2-16'];
          const good=d.sha==='c7ca35f7c747f93f827089bc97464c4d965c6834' && d.reviews?.length===4 &&
            d.reviews.every((r,i)=>r.id===ids[i] && r.status==='PASS' &&
              Array.isArray(r.issues) && r.issues.length===0 &&
              ['keyEvidence','distractorEvidence','lessonEvidence','limitations'].every(f=>
                typeof r[f]==='string' && r[f].trim().length>0));
          appendFileSync(process.env.GITHUB_OUTPUT,'proceed='+(good?'true':'false')+'\n');
          if (!good) console.log('FIX/REVIEW or insufficient evidence: second API call is blocked.');
          NODE

      - name: Verify no drift before optional second Gemini call
        if: steps.first-gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTUAL=$(gh api "repos/$GITHUB_REPOSITORY/pulls/264" --jq '.head.sha')
          test "$ACTUAL" = 'c7ca35f7c747f93f827089bc97464c4d965c6834' || { echo 'PR changed before second batch'; exit 1; }

      - name: OPTIONAL SECOND bounded Gemini API call (only after 4 PASS)
        if: steps.first-gate.outputs.proceed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-4-hydrogen
        run: node trusted/scripts/gemini-audit-review.mjs audit-pack/second.json audit-output/second.md audit-output/second.json

      - name: Verify exact PR SHA before posting second report
        if: steps.first-gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTUAL=$(gh api "repos/$GITHUB_REPOSITORY/pulls/264" --jq '.head.sha')
          test "$ACTUAL" = 'c7ca35f7c747f93f827089bc97464c4d965c6834' || { echo 'PR changed, refuse stale advisory report'; exit 1; }

      - name: Post second read-only advisory to target PR
        if: steps.first-gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 264 --repo "$GITHUB_REPOSITORY" --body-file audit-output/second.md
          cat audit-output/second.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep exact-SHA evidence, even if review fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-shot-gemini-264-materials
          path: |
            audit-pack/
            audit-output/
          if-no-files-found: ignore
          retention-days: 7

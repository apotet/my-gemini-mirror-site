name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Validate question bank (esbuild real modules)
        run: npm run validate:questions

      - name: Coverage report
        run: npm run coverage:explanations

      - name: Quiz logic unit tests
        run: npm run test:logic

      - name: CLI Tab regression tests
        run: node scripts/cli-tab.test.mjs

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-coverage
          path: |
            scripts/.cache/coverage-report.json
            scripts/.cache/coverage-summary.txt
            scripts/.cache/validate-summary.txt
          if-no-files-found: ignore

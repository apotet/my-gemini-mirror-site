name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/cli-stp-cst-engine, feat/cli-stp-forwarding, feat/cli-stp-diagnostics, integration/cli-2-stp-theory]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Validate question bank (esbuild real modules)
        run: npm run validate:questions

      - name: Coverage report
        run: npm run coverage:explanations

      - name: Cisco IOS show diagnosis lab regression
        run: node scripts/cli-show-diagnostic.test.mjs

      - name: CLI Tab regression tests
        run: node scripts/cli-tab.test.mjs

      - name: Cisco IOS unique abbreviations regression
        run: node scripts/cli-abbreviations.test.mjs

      - name: Cisco IOS canonical command resolution regression
        run: node scripts/cli-canonical-resolution.test.mjs

      - name: Cisco IOS argument grammar regression
        run: node scripts/cli-arguments.test.mjs

      - name: CLI topology layer selection regression
        run: node scripts/cli-topology-layers.test.mjs

      - name: CLI scenario-specific theory coverage
        run: node scripts/cli-theory-links.test.mjs

      - name: Cisco IOS contextual question-mark help regression
        run: node scripts/cli-contextual-help.test.mjs

      - name: Targeted SVI running-config and IP-mask regression
        run: node scripts/cli-svi-show.test.mjs

      - name: Cisco show interfaces and help regression
        run: node scripts/cli-show-interfaces.test.mjs

      - name: Cisco interface operational state regression
        run: node scripts/cli-operational-state.test.mjs

      - name: Cisco IOS modes learning lab regression
        run: node scripts/cli-ios-modes-lab.test.mjs

      - name: CLI lesson glossary links regression
        run: node scripts/cli-lesson-terms.test.mjs

      - name: CLI reference scope and links regression
        run: node scripts/cli-reference.test.mjs

      - name: Two-switch VLAN path regression
        run: node scripts/cli-two-switch.test.mjs

      - name: Three-switch VLAN fault regression
        run: node scripts/cli-three-switch.test.mjs

      - name: Diagnostic Learn no-spoiler regression
        run: node scripts/cli-diagnostic-hints.test.mjs

      - name: Selective trunk VLAN diagnostics regression
        run: node scripts/cli-trunk-diagnostics.test.mjs

      - name: Cisco trunk allowed VLAN operations regression
        run: node scripts/cli-trunk-allowed-ops.test.mjs

      - name: Cisco IOS running/startup persistence regression
        run: node scripts/cli-persistence.test.mjs

      - name: Deterministic IEEE 802.1D CST regression
        run: node scripts/cli-stp.test.mjs

      - name: CST forwarding and SVI integration regression
        run: node scripts/cli-stp-forwarding.test.mjs

      - name: Cisco IOS CST diagnostic commands regression
        run: node scripts/cli-spanning-tree.test.mjs

      - name: Cisco IOS CST configuration regression
        run: node scripts/cli-stp-configuration.test.mjs

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Quiz logic unit tests
        run: npm run test:logic

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-coverage
          path: |
            scripts/.cache/coverage-report.json
            scripts/.cache/coverage-summary.txt
            scripts/.cache/validate-summary.txt
          if-no-files-found: ignore

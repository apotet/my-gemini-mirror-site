name: ZAI Agent from GitHub Issue
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
jobs:
  task:
    if: >-
      github.repository == 'apotet/my-gemini-mirror-site' && github.actor == 'apotet' &&
      github.event.issue.user.login == 'apotet' && github.event.sender.type == 'User' &&
      !github.event.issue.pull_request && startsWith(github.event.issue.title, '[ZAI] ') &&
      github.run_attempt == 1 &&
      (github.event_name == 'issues' ||
       (github.event.comment.user.login == 'apotet' &&
        (startsWith(github.event.comment.body, '/agent continue ') ||
         startsWith(github.event.comment.body, '/agent validate ') ||
         startsWith(github.event.comment.body, '/agent publish '))))
    uses: ./.github/workflows/agent-task.yml
    with:
      provider: zai
    secrets:
      PROVIDER_API_KEY: ${{ secrets.ZAI_API_KEY }}

name: NetOps Understanding high-risk 12 exact source inspection (read only)
on:
  pull_request:
    types: [opened, synchronize]
    branches: [audit/gemini-batch03-50-fixes-20261120]
    paths:
      - 'scripts/in-depth-semantic-batch12.mjs'
      - 'src/data/inDepth/specificPracticalTips.ts'
      - '.github/workflows/in-depth-semantic-batch12-20261120.yml'
permissions:
  contents: read
jobs:
  twelve-source-packs:
    if: >-
      github.repository == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.repo.full_name == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.ref == 'audit/understanding-new4-fixes-20261120' &&
      github.event.pull_request.base.ref == 'audit/gemini-batch03-50-fixes-20261120' &&
      github.event.pull_request.user.login == 'apotet'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Collect exact current source packs and route validation
        run: node scripts/in-depth-semantic-batch12.mjs
      - name: Regression of Understanding bank, history and two-style lessons
        run: |
          npm run test:in-depth
          npm run test:in-depth-history
          npm run lint
          npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Real browser QoS explanation and exact lesson at mobile and desktop
        env:
          NETOPS_L2_IDS: review-qos-22
        run: |
          npm run preview -- --host 127.0.0.1 --port 5428 --strictPort > /tmp/netops-qos-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5428/my-gemini-mirror-site/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5428/my-gemini-mirror-site/ >/dev/null
          node scripts/in-depth.browser.mjs
      - name: Archive exact inputs for manual semantic review
        uses: actions/upload-artifact@v4
        with:
          name: semantic-batch12-frozen-source
          path: |
            scripts/.cache/in-depth/semantic-batch12/
            scripts/.cache/in-depth/browser/shard-0-of-1/
          if-no-files-found: error

name: One-shot Gemini 3.8 Flash 4-ID quality sample PR 264 (staging only)

on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/gemini-lite-audit-4-sample-pr264.yml'

permissions:
  contents: read

jobs:
  four-question-audit:
    if: >-
      github.repository == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.head.repo.full_name == 'apotet/my-gemini-mirror-site' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'audit/gemini-lite-sample4-pr264-20261120' &&
      github.event.pull_request.user.login == 'apotet'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Pin and verify PR 264 current source SHA (before Gemini)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTUAL=$(gh api "repos/$GITHUB_REPOSITORY/pulls/264" --jq '.head.sha')
          test "$ACTUAL" = '1f273787370a64cf39732974b60c1706e538f5bb' || { echo 'PR 264 SHA has drifted; abort before consuming API'; exit 1; }

      - name: Checkout trusted audit tools from staging main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Checkout frozen Understanding content from PR 264
        uses: actions/checkout@v4
        with:
          ref: 1f273787370a64cf39732974b60c1706e538f5bb
          path: subject
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bundler without executing package lifecycle scripts
        working-directory: subject
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Export exactly 4 questions and both lesson styles
        run: |
          node trusted/scripts/gemini-audit-pack.mjs subject 'k-05,l12-copp01,l12-storm01,l12-x02' audit-pack/four.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('audit-pack/four.json','utf8'));
          const expected=["k-05","l12-copp01","l12-storm01","l12-x02"];
          assert.equal(p.sha,'1f273787370a64cf39732974b60c1706e538f5bb');
          assert.deepEqual(p.ids,expected);
          assert.equal(p.records.length,4);
          assert.ok(p.records.every((r,i) => r.id===expected[i] &&
            typeof r.materialHash==='string' && r.materialHash.length===64 &&
            r.explanation?.plain && r.explanation?.professional &&
            Array.isArray(r.lesson?.coverageIssues)));
          console.log('Frozen 4 independent records at SHA',p.sha);
          NODE

      - name: Extend only runner-local trusted reviewer limits for a 4-question response
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const path='trusted/scripts/gemini-audit-review.mjs';
          const original=readFileSync(path,'utf8');
          if (!original.includes('AbortSignal.timeout(160000)') ||
              !original.includes('maxOutputTokens:8192') ||
              !original.includes("['gemini-4-hydrogen','gemini-3.8-flash']")) {
            throw new Error('Trusted reviewer has changed: require fresh inspection, no API call');
          }
          const patched=original
            .replace('AbortSignal.timeout(160000)','AbortSignal.timeout(420000)')
            .replace('maxOutputTokens:8192','maxOutputTokens:16384')
            .replace("['gemini-4-hydrogen','gemini-3.8-flash']", "['gemini-4-hydrogen','gemini-3.8-flash','gemini-3.5-flash-lite']");
          writeFileSync('trusted/scripts/gemini-audit-review-lite-sample.mjs',patched);
          console.log('Trusted reviewer copied. Only timeout (420s), response output cap (16384) and Lite allowlist entry altered; trusted main unchanged.');
          NODE

      - name: ONE Gemini API call reviewing all four questions (NO RETRIES)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'No secret; no API call'; exit 1; }
          node trusted/scripts/gemini-audit-review-lite-sample.mjs audit-pack/four.json audit-output/four.md audit-output/four.json

      - name: Check response cardinality and SHA before reporting
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('audit-output/four.json','utf8'));
          const ids=["k-05","l12-copp01","l12-storm01","l12-x02"];
          assert.equal(p.sha,'1f273787370a64cf39732974b60c1706e538f5bb');
          assert.equal(p.reviews.length,4);
          assert.deepEqual(p.reviews.map(r=>r.id),ids);
          assert.ok(p.reviews.every(r=>['PASS','FIX','REVIEW'].includes(r.status)));
          console.log('Gemini returned exactly 4 per-ID structured review records');
          NODE

      - name: Refuse to post stale report if PR 264 moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTUAL=$(gh api "repos/$GITHUB_REPOSITORY/pulls/264" --jq '.head.sha')
          test "$ACTUAL" = '1f273787370a64cf39732974b60c1706e538f5bb' || { echo 'PR changed; do not post stale status'; exit 1; }

      - name: Write advisory evidence to PR 264, never approve or merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 264 --repo "$GITHUB_REPOSITORY" --body-file audit-output/four.md
          cat audit-output/four.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain frozen input and output if any step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-lite-pr264-4-questions-once
          path: |
            audit-pack/
            audit-output/
          if-no-files-found: ignore
          retention-days: 7

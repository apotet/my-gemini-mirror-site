name: NetOps Telegram notifications
on:
  workflow_run:
    workflows: ["NetOps checks", "Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/telegram-notify.yml'
      - 'scripts/telegram-notify.py'
      - 'scripts/telegram-notify.test.py'
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/telegram-notify.test.py
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        (contains(fromJSON('["failure","cancelled","timed_out","action_required"]'), github.event.workflow_run.conclusion) ||
          (github.event.workflow_run.name == 'Deploy to GitHub Pages' && github.event.workflow_run.conclusion == 'success')))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: netops-staging-telegram-delivery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deliver final result and verify Telegram message ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram-notify.py

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 872" role="img" aria-labelledby="t"><title id="t">Маршрутизатор заменяет кадр и уменьшает TTL, сохраняя IP без NAT</title><rect width="320" height="872" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><text x="20" y="30" font-size="19" fill="#eaf1ff" font-weight="700">Один IP-пакет · два кадра</text><g transform="translate(129 52)" stroke="#60b5ff" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="58" height="39" rx="4"/><path d="M22 43v8h20v-8M12 54h40"/><path d="m12 26 10-10 8 8 8-12 12 14"/></g><text x="20" y="135" font-size="17" fill="#60b5ff" font-weight="700">Компьютер · 192.0.2.10</text><path d="M160 140v22m-5-6 5 6 5-6" stroke="#a5bbd3" stroke-width="2" fill="none"/><g transform="translate(129 164)" stroke="#c3a2ff" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2 15 16-10h34l9 10v30H2Z"/><path d="M2 15h59M10 27h6v8h-6zm12 0h6v8h-6zm12 0h6v8h-6zm12 0h6v8h-6z"/></g><text x="20" y="247" font-size="17" fill="#c3a2ff" font-weight="700">Коммутатор · первый канал</text><path d="M160 252v22m-5-6 5 6 5-6" stroke="#a5bbd3" stroke-width="2" fill="none"/><g transform="translate(129 358)" stroke="#ffbd61" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="15" rx="28" ry="12"/><path d="M4 15v29c0 16 56 16 56 0V15M18 15h28m-6-5 6 5-6 5M32 7v17m-5-5 5 5 5-5"/></g><text x="20" y="441" font-size="17" fill="#ffbd61" font-weight="700">Маршрутизатор</text><path d="M160 446v22m-5-6 5 6 5-6" stroke="#a5bbd3" stroke-width="2" fill="none"/><g transform="translate(129 570)" stroke="#c3a2ff" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2 15 16-10h34l9 10v30H2Z"/><path d="M2 15h59M10 27h6v8h-6zm12 0h6v8h-6zm12 0h6v8h-6zm12 0h6v8h-6z"/></g><text x="20" y="653" font-size="17" fill="#c3a2ff" font-weight="700">Коммутатор · второй канал</text><path d="M160 658v22m-5-6 5 6 5-6" stroke="#a5bbd3" stroke-width="2" fill="none"/><g transform="translate(129 682)" stroke="#60b5ff" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="0" width="42" height="58" rx="5"/><path d="M16 15h30M16 30h30M16 45h30"/><circle cx="20" cy="9" r="1"/><circle cx="20" cy="24" r="1"/><circle cx="20" cy="39" r="1"/></g><text x="20" y="765" font-size="17" fill="#60b5ff" font-weight="700">Сервер · 198.51.100.20</text><rect x="12" y="280" width="296" height="67" rx="12" fill="#13273e"/><text x="22" y="307" font-size="15" fill="#c3a2ff" font-weight="400">Кадр 1: компьютер → MAC шлюза</text><text x="22" y="333" font-size="16" fill="#ffbd61" font-weight="400">IP-пакет · TTL 64</text><rect x="12" y="472" width="296" height="85" rx="12" fill="#13273e"/><text x="22" y="498" font-size="14" fill="#c3a2ff" font-weight="400">Кадр 2: MAC выхода → MAC сервера</text><text x="22" y="524" font-size="16" fill="#ffbd61" font-weight="400">Те же IP-адреса · TTL 63</text><text x="22" y="546" font-size="15" fill="#c3a2ff" font-weight="400">Новые MAC и FCS</text><text x="20" y="795" font-size="15" fill="#eaf1ff" font-weight="400">Без NAT. Сумма заголовка IPv4</text><text x="20" y="819" font-size="15" fill="#eaf1ff" font-weight="400">обновлена после изменения TTL.</text></g></svg>
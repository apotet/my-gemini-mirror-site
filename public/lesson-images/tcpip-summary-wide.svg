<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 115" role="img" aria-labelledby="t"><title id="t">Направление отправки и приёма</title><style>:root{--tcpip-ink:#192d43;--tcpip-panel:#edf3fa;--tcpip-route-panel:#fff3dc;--tcpip-line:#506781;--tcpip-rule:#657c95;--tcpip-chip-ink:#142438;--tcpip-application:#205a98;--tcpip-transport:#355e23;--tcpip-internet:#7c4607;--tcpip-link:#624292;--tcpip-application-chip:#c2dfff;--tcpip-transport-chip:#d1ebba;--tcpip-internet-chip:#ffe4b4;--tcpip-link-chip:#e4d7ff;}@media (prefers-color-scheme: dark){:root{--tcpip-ink:#eaf1ff;--tcpip-panel:#13273e;--tcpip-route-panel:#272d3b;--tcpip-line:#a5bbd3;--tcpip-rule:#597491;--tcpip-chip-ink:#142438;--tcpip-application:#80c2ff;--tcpip-transport:#a7df82;--tcpip-internet:#ffc776;--tcpip-link:#cfb4ff;--tcpip-application-chip:#60b5ff;--tcpip-transport-chip:#9ddb70;--tcpip-internet-chip:#ffbd61;--tcpip-link-chip:#c3a2ff;}}</style><g font-family="Arial, sans-serif"><rect x="10" y="10" width="620" height="96" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><text x="22" y="36" font-size="18" fill="var(--tcpip-application,#205a98)" font-weight="700">↓ Отправка</text><text x="22" y="63" font-size="17" fill="var(--tcpip-ink,#192d43)" font-weight="400">Сообщение → сегмент / датаграмма → IP-пакет → кадр → сигналы</text><text x="22" y="89" font-size="17" fill="var(--tcpip-link,#624292)" font-weight="700">↑ Приём: от сигналов к сообщению</text></g></svg>
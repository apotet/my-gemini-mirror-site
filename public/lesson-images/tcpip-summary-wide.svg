<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 147" role="img" aria-labelledby="t"><title id="t">Направление отправки и приёма</title><rect width="640" height="147" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><rect x="10" y="10" width="620" height="96" rx="12" fill="#13273e"/><text x="22" y="36" font-size="18" fill="#60b5ff" font-weight="700">↓ Отправка</text><text x="22" y="63" font-size="17" fill="#eaf1ff" font-weight="400">Сообщение → сегмент / датаграмма → IP-пакет → кадр → сигналы</text><text x="22" y="89" font-size="17" fill="#c3a2ff" font-weight="700">↑ Приём: от сигналов к сообщению</text></g></svg>
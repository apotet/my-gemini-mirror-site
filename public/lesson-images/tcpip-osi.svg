<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 570" role="img" aria-labelledby="t"><title id="t">Условное соответствие семи уровней OSI четырём TCP/IP</title><rect width="320" height="570" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><text x="20" y="30" font-size="20" fill="#eaf1ff" font-weight="700">OSI → TCP/IP</text><rect x="10" y="52" width="300" height="103" rx="12" fill="#13273e"/><path d="M12 68v68" stroke="#60b5ff" stroke-width="4"/><text x="24" y="81" font-size="18" fill="#60b5ff" font-weight="700">7 + 6 + 5 → 4 · Прикладной</text><text x="24" y="111" font-size="16" fill="#eaf1ff" font-weight="400">7 Прикладной · 6 Представления</text><text x="24" y="135" font-size="16" fill="#eaf1ff" font-weight="400">5 Сеансовый</text><rect x="10" y="174" width="300" height="79" rx="12" fill="#13273e"/><path d="M12 190v44" stroke="#9ddb70" stroke-width="4"/><text x="24" y="203" font-size="18" fill="#9ddb70" font-weight="700">4 → 3 · Транспортный</text><text x="24" y="233" font-size="16" fill="#eaf1ff" font-weight="400">Доставка между программами</text><rect x="10" y="272" width="300" height="79" rx="12" fill="#13273e"/><path d="M12 288v44" stroke="#ffbd61" stroke-width="4"/><text x="24" y="301" font-size="18" fill="#ffbd61" font-weight="700">3 → 2 · Межсетевой</text><text x="24" y="331" font-size="16" fill="#eaf1ff" font-weight="400">IP-адреса и выбор пути</text><rect x="10" y="370" width="300" height="79" rx="12" fill="#13273e"/><path d="M12 386v44" stroke="#c3a2ff" stroke-width="4"/><text x="24" y="399" font-size="18" fill="#c3a2ff" font-weight="700">2 + 1 → 1 · Сетевой доступ</text><text x="24" y="429" font-size="16" fill="#eaf1ff" font-weight="400">2 Канальный · 1 Физический</text><text x="20" y="490" font-size="16" fill="#eaf1ff" font-weight="400">Это соответствие функций,</text><text x="20" y="514" font-size="16" fill="#eaf1ff" font-weight="400">а не обязательных заголовков.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 241" role="img" aria-labelledby="t"><title id="t">Разбор принятого кадра: Ethernet, IPv4, TCP и запрос HTTP</title><rect width="640" height="241" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><text x="10" y="28" font-size="18" fill="#eaf1ff" font-weight="700">Приём ↓</text><rect x="10" y="42" width="124" height="30" rx="4" fill="#c3a2ff"/><text text-anchor="middle" x="72.0" y="63" font-size="17" fill="#091728" font-weight="700">Ethernet</text><rect x="136" y="42" width="92" height="30" rx="4" fill="#ffbd61"/><text text-anchor="middle" x="182.0" y="63" font-size="17" fill="#091728" font-weight="700">IPv4</text><rect x="230" y="42" width="94" height="30" rx="4" fill="#9ddb70"/><text text-anchor="middle" x="277.0" y="63" font-size="17" fill="#091728" font-weight="700">TCP</text><rect x="326" y="42" width="229" height="30" rx="4" fill="#60b5ff"/><text text-anchor="middle" x="440.5" y="63" font-size="17" fill="#091728" font-weight="700">HTTP</text><rect x="557" y="42" width="71" height="30" rx="4" fill="#c3a2ff"/><text text-anchor="middle" x="592.5" y="63" font-size="17" fill="#091728" font-weight="700">FCS</text><text x="10" y="96" font-size="16" fill="#eaf1ff" font-weight="400">Сигналы → биты Ethernet-кадра</text><rect x="10" y="108" width="151" height="84" rx="12" fill="#13273e"/><text x="19" y="134" font-size="18" fill="#c3a2ff" font-weight="700">1 · Ethernet</text><text x="19" y="157" font-size="16" fill="#eaf1ff" font-weight="400">Проверяет FCS</text><text x="19" y="179" font-size="16" fill="#eaf1ff" font-weight="400">0x0800 → IPv4</text><rect x="166" y="108" width="151" height="84" rx="12" fill="#13273e"/><text x="175" y="134" font-size="18" fill="#ffbd61" font-weight="700">2 · IPv4</text><text x="175" y="157" font-size="16" fill="#eaf1ff" font-weight="400">Читает заголовок</text><text x="175" y="179" font-size="16" fill="#eaf1ff" font-weight="400">Protocol 6 → TCP</text><rect x="322" y="108" width="151" height="84" rx="12" fill="#13273e"/><text x="331" y="134" font-size="18" fill="#9ddb70" font-weight="700">3 · TCP</text><text x="331" y="157" font-size="16" fill="#eaf1ff" font-weight="400">Собирает поток</text><text x="331" y="179" font-size="16" fill="#eaf1ff" font-weight="400">Порт 80 → HTTP</text><rect x="478" y="108" width="151" height="84" rx="12" fill="#13273e"/><text x="487" y="134" font-size="18" fill="#60b5ff" font-weight="700">4 · HTTP</text><text x="487" y="157" font-size="16" fill="#eaf1ff" font-weight="400">Читает запрос</text><text x="487" y="179" font-size="16" fill="#eaf1ff" font-weight="400">GET / HTTP/1.1</text></g></svg>
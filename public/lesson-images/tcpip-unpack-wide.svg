<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 209" role="img" aria-labelledby="t"><title id="t">Разбор принятого кадра: Ethernet, IPv4, TCP и запрос HTTP</title><style>:root{--tcpip-ink:#192d43;--tcpip-panel:#edf3fa;--tcpip-route-panel:#fff3dc;--tcpip-line:#506781;--tcpip-rule:#657c95;--tcpip-chip-ink:#142438;--tcpip-application:#205a98;--tcpip-transport:#355e23;--tcpip-internet:#7c4607;--tcpip-link:#624292;--tcpip-application-chip:#c2dfff;--tcpip-transport-chip:#d1ebba;--tcpip-internet-chip:#ffe4b4;--tcpip-link-chip:#e4d7ff;}@media (prefers-color-scheme: dark){:root{--tcpip-ink:#eaf1ff;--tcpip-panel:#13273e;--tcpip-route-panel:#272d3b;--tcpip-line:#a5bbd3;--tcpip-rule:#597491;--tcpip-chip-ink:#142438;--tcpip-application:#80c2ff;--tcpip-transport:#a7df82;--tcpip-internet:#ffc776;--tcpip-link:#cfb4ff;--tcpip-application-chip:#60b5ff;--tcpip-transport-chip:#9ddb70;--tcpip-internet-chip:#ffbd61;--tcpip-link-chip:#c3a2ff;}}</style><g font-family="Arial, sans-serif"><text x="10" y="28" font-size="18" fill="var(--tcpip-ink,#192d43)" font-weight="700">Приём ↓</text><rect x="10" y="42" width="124" height="30" rx="4" fill="var(--tcpip-link-chip,#e4d7ff)"/><text text-anchor="middle" x="72.0" y="63" font-size="17" fill="var(--tcpip-chip-ink,#142438)" font-weight="700">Ethernet</text><rect x="136" y="42" width="92" height="30" rx="4" fill="var(--tcpip-internet-chip,#ffe4b4)"/><text text-anchor="middle" x="182.0" y="63" font-size="17" fill="var(--tcpip-chip-ink,#142438)" font-weight="700">IPv4</text><rect x="230" y="42" width="94" height="30" rx="4" fill="var(--tcpip-transport-chip,#d1ebba)"/><text text-anchor="middle" x="277.0" y="63" font-size="17" fill="var(--tcpip-chip-ink,#142438)" font-weight="700">TCP</text><rect x="326" y="42" width="229" height="30" rx="4" fill="var(--tcpip-application-chip,#c2dfff)"/><text text-anchor="middle" x="440.5" y="63" font-size="17" fill="var(--tcpip-chip-ink,#142438)" font-weight="700">HTTP</text><rect x="557" y="42" width="71" height="30" rx="4" fill="var(--tcpip-link-chip,#e4d7ff)"/><text text-anchor="middle" x="592.5" y="63" font-size="17" fill="var(--tcpip-chip-ink,#142438)" font-weight="700">FCS</text><text x="10" y="96" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Сигналы → биты Ethernet-кадра</text><rect x="10" y="108" width="151" height="84" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><text x="19" y="134" font-size="18" fill="var(--tcpip-link,#624292)" font-weight="700">1 · Ethernet</text><text x="19" y="157" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Проверяет FCS</text><text x="19" y="179" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">0x0800 → IPv4</text><rect x="166" y="108" width="151" height="84" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><text x="175" y="134" font-size="18" fill="var(--tcpip-internet,#7c4607)" font-weight="700">2 · IPv4</text><text x="175" y="157" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Читает заголовок</text><text x="175" y="179" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Protocol 6 → TCP</text><rect x="322" y="108" width="151" height="84" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><text x="331" y="134" font-size="18" fill="var(--tcpip-transport,#355e23)" font-weight="700">3 · TCP</text><text x="331" y="157" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Собирает поток</text><text x="331" y="179" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Порт 80 → HTTP</text><rect x="478" y="108" width="151" height="84" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><text x="487" y="134" font-size="18" fill="var(--tcpip-application,#205a98)" font-weight="700">4 · HTTP</text><text x="487" y="157" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Читает запрос</text><text x="487" y="179" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">GET / HTTP/1.1</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 241" role="img" aria-labelledby="t"><title id="t">TCP и UDP после потери второго блока</title><style>:root{--tcpip-ink:#192d43;--tcpip-panel:#edf3fa;--tcpip-route-panel:#fff3dc;--tcpip-line:#506781;--tcpip-rule:#657c95;--tcpip-chip-ink:#142438;--tcpip-application:#205a98;--tcpip-transport:#355e23;--tcpip-internet:#7c4607;--tcpip-link:#624292;--tcpip-application-chip:#c2dfff;--tcpip-transport-chip:#d1ebba;--tcpip-internet-chip:#ffe4b4;--tcpip-link-chip:#e4d7ff;}@media (prefers-color-scheme: dark){:root{--tcpip-ink:#eaf1ff;--tcpip-panel:#13273e;--tcpip-route-panel:#272d3b;--tcpip-line:#a5bbd3;--tcpip-rule:#597491;--tcpip-chip-ink:#142438;--tcpip-application:#80c2ff;--tcpip-transport:#a7df82;--tcpip-internet:#ffc776;--tcpip-link:#cfb4ff;--tcpip-application-chip:#60b5ff;--tcpip-transport-chip:#9ddb70;--tcpip-internet-chip:#ffbd61;--tcpip-link-chip:#c3a2ff;}}</style><g font-family="Arial, sans-serif"><text x="16" y="27" font-size="20" fill="var(--tcpip-ink,#192d43)" font-weight="700">Блок 2 не дошёл</text><rect x="10" y="44" width="300" height="87" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><text x="23" y="68" font-size="18" fill="var(--tcpip-transport,#355e23)" font-weight="700">TCP · поток</text><text x="23" y="93" font-size="17" fill="var(--tcpip-ink,#192d43)" font-weight="400">Повтор блока 2</text><text x="23" y="117" font-size="17" fill="var(--tcpip-transport,#355e23)" font-weight="700">Результат: 1 · 2 · 3</text><rect x="10" y="141" width="300" height="87" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><text x="23" y="165" font-size="18" fill="var(--tcpip-internet,#7c4607)" font-weight="700">UDP · датаграммы</text><text x="23" y="190" font-size="17" fill="var(--tcpip-ink,#192d43)" font-weight="400">UDP сам не повторяет</text><text x="23" y="214" font-size="17" fill="var(--tcpip-internet,#7c4607)" font-weight="700">Результат: 1 · 3</text></g></svg>
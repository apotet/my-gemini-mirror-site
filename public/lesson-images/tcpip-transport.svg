<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 602" role="img" aria-labelledby="t"><title id="t">TCP восстанавливает поток, UDP не даёт встроенных гарантий доставки</title><rect width="320" height="602" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><text x="20" y="30" font-size="16" fill="#eaf1ff" font-weight="700">Одна потеря — разные результаты</text><rect x="10" y="54" width="300" height="175" rx="12" fill="#13273e"/><path d="M12 70v140" stroke="#9ddb70" stroke-width="4"/><text x="24" y="83" font-size="18" fill="#9ddb70" font-weight="700">TCP · поток байтов</text><text x="24" y="113" font-size="16" fill="#eaf1ff" font-weight="400">Отправлены: [1] → [2] → [3]</text><text x="24" y="137" font-size="16" fill="#eaf1ff" font-weight="400">Потеря:              × [2]</text><text x="24" y="161" font-size="16" fill="#eaf1ff" font-weight="400">Получатель подтверждает приём</text><text x="24" y="185" font-size="16" fill="#eaf1ff" font-weight="400">Отправитель повторяет [2]</text><text x="24" y="209" font-size="16" fill="#eaf1ff" font-weight="400">Программа читает: [1][2][3]</text><rect x="10" y="270" width="300" height="175" rx="12" fill="#13273e"/><path d="M12 286v140" stroke="#9ddb70" stroke-width="4"/><text x="24" y="299" font-size="18" fill="#9ddb70" font-weight="700">UDP · отдельные датаграммы</text><text x="24" y="329" font-size="16" fill="#eaf1ff" font-weight="400">Отправлены: [1] → [2] → [3]</text><text x="24" y="353" font-size="16" fill="#eaf1ff" font-weight="400">Потеря:              × [2]</text><text x="24" y="377" font-size="16" fill="#eaf1ff" font-weight="400">UDP не подтверждает и не повторяет</text><text x="24" y="401" font-size="16" fill="#eaf1ff" font-weight="400">Доставлено: [1] и [3]</text><text x="24" y="425" font-size="16" fill="#eaf1ff" font-weight="400">Приложение решает, что делать</text><text x="20" y="500" font-size="15" fill="#eaf1ff" font-weight="400">Схема упрощена. TCP сохраняет</text><text x="20" y="523" font-size="15" fill="#eaf1ff" font-weight="400">порядок байтов, но не границы</text><text x="20" y="546" font-size="15" fill="#eaf1ff" font-weight="400">сообщений приложения.</text></g></svg>
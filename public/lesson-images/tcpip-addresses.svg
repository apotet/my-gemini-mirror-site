<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 562" role="img" aria-labelledby="t"><title id="t">Порты, IP и MAC на первом канале</title><rect width="320" height="562" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><text x="20" y="30" font-size="20" fill="#eaf1ff" font-weight="700">Три разных «кому»</text><rect x="10" y="52" width="300" height="151" rx="12" fill="#13273e"/><path d="M12 68v116" stroke="#9ddb70" stroke-width="4"/><text x="24" y="81" font-size="18" fill="#9ddb70" font-weight="700">TCP · Порт</text><text x="24" y="111" font-size="16" fill="#eaf1ff" font-weight="400">51514 → 80</text><text x="24" y="135" font-size="16" fill="#eaf1ff" font-weight="400">Клиент → HTTP-служба</text><text x="24" y="159" font-size="16" fill="#eaf1ff" font-weight="400">Конечная точка сервера:</text><text x="24" y="183" font-size="16" fill="#eaf1ff" font-weight="400">TCP 198.51.100.20:80</text><rect x="10" y="228" width="300" height="103" rx="12" fill="#13273e"/><path d="M12 244v68" stroke="#ffbd61" stroke-width="4"/><text x="24" y="257" font-size="18" fill="#ffbd61" font-weight="700">IP · Конечный узел</text><text x="24" y="287" font-size="16" fill="#eaf1ff" font-weight="400">192.0.2.10 → 198.51.100.20</text><text x="24" y="311" font-size="16" fill="#eaf1ff" font-weight="400">Источник → удалённый сервер</text><rect x="10" y="356" width="300" height="151" rx="12" fill="#13273e"/><path d="M12 372v116" stroke="#c3a2ff" stroke-width="4"/><text x="24" y="385" font-size="18" fill="#c3a2ff" font-weight="700">MAC · Сосед на канале</text><text x="24" y="415" font-size="16" fill="#eaf1ff" font-weight="400">02:00:00:00:01:10 →</text><text x="24" y="439" font-size="16" fill="#eaf1ff" font-weight="400">02:00:00:00:01:01</text><text x="24" y="463" font-size="16" fill="#eaf1ff" font-weight="400">Компьютер → шлюз,</text><text x="24" y="487" font-size="16" fill="#eaf1ff" font-weight="400">а не удалённый сервер</text></g></svg>
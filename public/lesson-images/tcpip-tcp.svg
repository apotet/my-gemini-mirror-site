<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 829" role="img" aria-labelledby="t"><title id="t">TCP · заголовок 20–60 байт</title><rect width="320" height="829" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><text x="16" y="30" font-size="18" fill="#9ddb70" font-weight="700">TCP · заголовок 20–60 байт</text><rect x="10" y="48" width="300" height="79" rx="12" fill="#13273e"/><path d="M12 64v44" stroke="#9ddb70" stroke-width="4"/><text x="24" y="77" font-size="18" fill="#9ddb70" font-weight="700">Порты · 16 + 16 бит</text><text x="24" y="107" font-size="16" fill="#eaf1ff" font-weight="400">Источник и получатель</text><rect x="10" y="137" width="300" height="103" rx="12" fill="#13273e"/><path d="M12 153v68" stroke="#9ddb70" stroke-width="4"/><text x="24" y="166" font-size="18" fill="#9ddb70" font-weight="700">Номера · 32 + 32 бит</text><text x="24" y="196" font-size="16" fill="#eaf1ff" font-weight="400">Sequence: положение байтов</text><text x="24" y="220" font-size="16" fill="#eaf1ff" font-weight="400">Acknowledgment: следующий байт</text><rect x="10" y="250" width="300" height="127" rx="12" fill="#13273e"/><path d="M12 266v92" stroke="#9ddb70" stroke-width="4"/><text x="24" y="279" font-size="18" fill="#9ddb70" font-weight="700">Длина и флаги · 16 бит</text><text x="24" y="309" font-size="16" fill="#eaf1ff" font-weight="400">Data Offset: 4 · резерв: 3</text><text x="24" y="333" font-size="16" fill="#eaf1ff" font-weight="400">AE, CWR, ECE, URG, ACK,</text><text x="24" y="357" font-size="16" fill="#eaf1ff" font-weight="400">PSH, RST, SYN, FIN: по 1 биту</text><rect x="10" y="387" width="300" height="79" rx="12" fill="#13273e"/><path d="M12 403v44" stroke="#9ddb70" stroke-width="4"/><text x="24" y="416" font-size="18" fill="#9ddb70" font-weight="700">Окно · 16 бит</text><text x="24" y="446" font-size="16" fill="#eaf1ff" font-weight="400">Сколько данных готов принять узел</text><rect x="10" y="476" width="300" height="103" rx="12" fill="#13273e"/><path d="M12 492v68" stroke="#9ddb70" stroke-width="4"/><text x="24" y="505" font-size="18" fill="#9ddb70" font-weight="700">Checksum · 16 бит</text><text x="24" y="535" font-size="16" fill="#eaf1ff" font-weight="400">TCP-заголовок, данные</text><text x="24" y="559" font-size="16" fill="#eaf1ff" font-weight="400">и псевдозаголовок IP</text><rect x="10" y="589" width="300" height="79" rx="12" fill="#13273e"/><path d="M12 605v44" stroke="#9ddb70" stroke-width="4"/><text x="24" y="618" font-size="18" fill="#9ddb70" font-weight="700">Urgent Pointer · 16 бит</text><text x="24" y="648" font-size="16" fill="#eaf1ff" font-weight="400">Граница срочных данных при URG</text><rect x="10" y="678" width="300" height="103" rx="12" fill="#13273e"/><path d="M12 694v68" stroke="#9ddb70" stroke-width="4"/><text x="24" y="707" font-size="18" fill="#9ddb70" font-weight="700">Опции и выравнивание · 0–40 Б</text><text x="24" y="737" font-size="16" fill="#eaf1ff" font-weight="400">MSS, SACK, метки времени</text><text x="24" y="761" font-size="16" fill="#eaf1ff" font-weight="400">До границы 32 бит</text></g></svg>
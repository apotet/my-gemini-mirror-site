<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 143" role="img" aria-labelledby="t"><title id="t">Сравнение порта TCP, IP удалённого сервера и MAC шлюза на первом канале</title><style>:root{--tcpip-ink:#192d43;--tcpip-panel:#edf3fa;--tcpip-route-panel:#fff3dc;--tcpip-line:#506781;--tcpip-rule:#657c95;--tcpip-chip-ink:#142438;--tcpip-application:#205a98;--tcpip-transport:#355e23;--tcpip-internet:#7c4607;--tcpip-link:#624292;--tcpip-application-chip:#c2dfff;--tcpip-transport-chip:#d1ebba;--tcpip-internet-chip:#ffe4b4;--tcpip-link-chip:#e4d7ff;}@media (prefers-color-scheme: dark){:root{--tcpip-ink:#eaf1ff;--tcpip-panel:#13273e;--tcpip-route-panel:#272d3b;--tcpip-line:#a5bbd3;--tcpip-rule:#597491;--tcpip-chip-ink:#142438;--tcpip-application:#80c2ff;--tcpip-transport:#a7df82;--tcpip-internet:#ffc776;--tcpip-link:#cfb4ff;--tcpip-application-chip:#60b5ff;--tcpip-transport-chip:#9ddb70;--tcpip-internet-chip:#ffbd61;--tcpip-link-chip:#c3a2ff;}}</style><g font-family="Arial, sans-serif"><rect x="10" y="10" width="202" height="117" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><text x="20" y="36" font-size="19" fill="var(--tcpip-transport,#355e23)" font-weight="700">TCP · Порт</text><text x="20" y="61" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Служба</text><text x="20" y="88" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">51514 → 80</text><rect x="219" y="10" width="202" height="117" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><text x="229" y="36" font-size="19" fill="var(--tcpip-internet,#7c4607)" font-weight="700">IP · Узел</text><text x="229" y="61" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Компьютер → сервер</text><text x="229" y="88" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">192.0.2.10</text><text x="229" y="113" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">→ 198.51.100.20</text><rect x="428" y="10" width="202" height="117" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><text x="438" y="36" font-size="19" fill="var(--tcpip-link,#624292)" font-weight="700">MAC · Сосед</text><text x="438" y="61" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Компьютер → шлюз</text><text x="438" y="88" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">02:00:00:00:01:10</text><text x="438" y="113" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">→ 02:00:00:00:01:01</text></g></svg>
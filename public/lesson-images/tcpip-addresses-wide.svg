<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 175" role="img" aria-labelledby="t"><title id="t">Сравнение порта TCP, IP удалённого сервера и MAC шлюза на первом канале</title><rect width="640" height="175" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><rect x="10" y="10" width="202" height="117" rx="12" fill="#13273e"/><text x="20" y="36" font-size="19" fill="#9ddb70" font-weight="700">TCP · Порт</text><text x="20" y="61" font-size="16" fill="#eaf1ff" font-weight="400">Служба</text><text x="20" y="88" font-size="16" fill="#eaf1ff" font-weight="400">51514 → 80</text><rect x="219" y="10" width="202" height="117" rx="12" fill="#13273e"/><text x="229" y="36" font-size="19" fill="#ffbd61" font-weight="700">IP · Узел</text><text x="229" y="61" font-size="16" fill="#eaf1ff" font-weight="400">Компьютер → сервер</text><text x="229" y="88" font-size="16" fill="#eaf1ff" font-weight="400">192.0.2.10</text><text x="229" y="113" font-size="16" fill="#eaf1ff" font-weight="400">→ 198.51.100.20</text><rect x="428" y="10" width="202" height="117" rx="12" fill="#13273e"/><text x="438" y="36" font-size="19" fill="#c3a2ff" font-weight="700">MAC · Сосед</text><text x="438" y="61" font-size="16" fill="#eaf1ff" font-weight="400">Компьютер → шлюз</text><text x="438" y="88" font-size="16" fill="#eaf1ff" font-weight="400">02:00:00:00:01:10</text><text x="438" y="113" font-size="16" fill="#eaf1ff" font-weight="400">→ 02:00:00:00:01:01</text></g></svg>
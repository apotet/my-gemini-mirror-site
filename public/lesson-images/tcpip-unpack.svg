<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 749" role="img" aria-labelledby="t"><title id="t">Декапсуляция HTTP</title><rect width="320" height="749" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><text x="20" y="30" font-size="19" fill="#eaf1ff" font-weight="700">Приём: снаружи внутрь</text><rect x="10" y="50" width="300" height="79" rx="12" fill="#13273e"/><path d="M12 66v44" stroke="#c3a2ff" stroke-width="4"/><text x="24" y="79" font-size="18" fill="#c3a2ff" font-weight="700">1 · Принимаем сигналы</text><text x="24" y="109" font-size="16" fill="#eaf1ff" font-weight="400">Сигналы → биты кадра</text><path d="M160 131v22m-5-6 5 6 5-6" stroke="#a5bbd3" stroke-width="2" fill="none"/><rect x="10" y="161" width="300" height="103" rx="12" fill="#13273e"/><path d="M12 177v68" stroke="#c3a2ff" stroke-width="4"/><text x="24" y="190" font-size="18" fill="#c3a2ff" font-weight="700">2 · Ethernet проверяет FCS</text><text x="24" y="220" font-size="16" fill="#eaf1ff" font-weight="400">Тип 0x0800 → IPv4</text><text x="24" y="244" font-size="16" fill="#eaf1ff" font-weight="400">Заголовок и FCS обработаны</text><path d="M160 266v22m-5-6 5 6 5-6" stroke="#a5bbd3" stroke-width="2" fill="none"/><rect x="10" y="296" width="300" height="103" rx="12" fill="#13273e"/><path d="M12 312v68" stroke="#ffbd61" stroke-width="4"/><text x="24" y="325" font-size="18" fill="#ffbd61" font-weight="700">3 · IPv4 читает назначение</text><text x="24" y="355" font-size="16" fill="#eaf1ff" font-weight="400">Protocol 6 → TCP</text><text x="24" y="379" font-size="16" fill="#eaf1ff" font-weight="400">Заголовок IP обработан</text><path d="M160 401v22m-5-6 5 6 5-6" stroke="#a5bbd3" stroke-width="2" fill="none"/><rect x="10" y="431" width="300" height="103" rx="12" fill="#13273e"/><path d="M12 447v68" stroke="#9ddb70" stroke-width="4"/><text x="24" y="460" font-size="18" fill="#9ddb70" font-weight="700">4 · TCP собирает поток</text><text x="24" y="490" font-size="16" fill="#eaf1ff" font-weight="400">Порт 80 → приложение</text><text x="24" y="514" font-size="16" fill="#eaf1ff" font-weight="400">Заголовок TCP обработан</text><path d="M160 536v22m-5-6 5 6 5-6" stroke="#a5bbd3" stroke-width="2" fill="none"/><rect x="10" y="566" width="300" height="103" rx="12" fill="#13273e"/><path d="M12 582v68" stroke="#60b5ff" stroke-width="4"/><text x="24" y="595" font-size="18" fill="#60b5ff" font-weight="700">5 · Приложение читает HTTP</text><text x="24" y="625" font-size="16" fill="#eaf1ff" font-weight="400">GET / HTTP/1.1</text><text x="24" y="649" font-size="16" fill="#eaf1ff" font-weight="400">Host: lesson.test</text><text x="20" y="696" font-size="15" fill="#eaf1ff" font-weight="400">Вложения показаны не в масштабе.</text></g></svg>
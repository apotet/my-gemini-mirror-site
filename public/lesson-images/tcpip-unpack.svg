<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 375" role="img" aria-labelledby="t"><title id="t">Разбор принятого кадра: Ethernet, IPv4, TCP и запрос HTTP</title><rect width="320" height="375" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><text x="10" y="28" font-size="18" fill="#eaf1ff" font-weight="700">Приём ↓</text><rect x="10" y="42" width="84" height="30" rx="4" fill="#c3a2ff"/><text text-anchor="middle" x="52.0" y="63" font-size="16" fill="#091728" font-weight="700">Ethernet</text><rect x="96" y="42" width="52" height="30" rx="4" fill="#ffbd61"/><text text-anchor="middle" x="122.0" y="63" font-size="16" fill="#091728" font-weight="700">IPv4</text><rect x="150" y="42" width="49" height="30" rx="4" fill="#9ddb70"/><text text-anchor="middle" x="174.5" y="63" font-size="16" fill="#091728" font-weight="700">TCP</text><rect x="201" y="42" width="62" height="30" rx="4" fill="#60b5ff"/><text text-anchor="middle" x="232.0" y="63" font-size="16" fill="#091728" font-weight="700">HTTP</text><rect x="265" y="42" width="43" height="30" rx="4" fill="#c3a2ff"/><text text-anchor="middle" x="286.5" y="63" font-size="16" fill="#091728" font-weight="700">FCS</text><text x="10" y="96" font-size="16" fill="#eaf1ff" font-weight="400">Сигналы → биты Ethernet-кадра</text><rect x="10" y="108" width="300" height="52" rx="12" fill="#13273e"/><text x="19" y="139" font-size="17" fill="#c3a2ff" font-weight="700">1 · Ethernet</text><text x="140" y="130" font-size="16" fill="#eaf1ff" font-weight="400">Проверяет FCS</text><text x="140" y="151" font-size="16" fill="#eaf1ff" font-weight="400">0x0800 → IPv4</text><rect x="10" y="165" width="300" height="52" rx="12" fill="#13273e"/><text x="19" y="196" font-size="17" fill="#ffbd61" font-weight="700">2 · IPv4</text><text x="140" y="187" font-size="16" fill="#eaf1ff" font-weight="400">Читает заголовок</text><text x="140" y="208" font-size="16" fill="#eaf1ff" font-weight="400">Protocol 6 → TCP</text><rect x="10" y="222" width="300" height="52" rx="12" fill="#13273e"/><text x="19" y="253" font-size="17" fill="#9ddb70" font-weight="700">3 · TCP</text><text x="140" y="244" font-size="16" fill="#eaf1ff" font-weight="400">Собирает поток</text><text x="140" y="265" font-size="16" fill="#eaf1ff" font-weight="400">Порт 80 → HTTP</text><rect x="10" y="279" width="300" height="52" rx="12" fill="#13273e"/><text x="19" y="310" font-size="17" fill="#60b5ff" font-weight="700">4 · HTTP</text><text x="140" y="301" font-size="16" fill="#eaf1ff" font-weight="400">Читает запрос</text><text x="140" y="322" font-size="16" fill="#eaf1ff" font-weight="400">GET / HTTP/1.1</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 305" role="img" aria-labelledby="t"><title id="t">Уровни TCP/IP: при отправке 4 → 1, при приёме 1 → 4</title><style>:root{--tcpip-ink:#192d43;--tcpip-panel:#edf3fa;--tcpip-route-panel:#fff3dc;--tcpip-line:#506781;--tcpip-rule:#657c95;--tcpip-chip-ink:#142438;--tcpip-application:#205a98;--tcpip-transport:#355e23;--tcpip-internet:#7c4607;--tcpip-link:#624292;--tcpip-application-chip:#c2dfff;--tcpip-transport-chip:#d1ebba;--tcpip-internet-chip:#ffe4b4;--tcpip-link-chip:#e4d7ff;}@media (prefers-color-scheme: dark){:root{--tcpip-ink:#eaf1ff;--tcpip-panel:#13273e;--tcpip-route-panel:#272d3b;--tcpip-line:#a5bbd3;--tcpip-rule:#597491;--tcpip-chip-ink:#142438;--tcpip-application:#80c2ff;--tcpip-transport:#a7df82;--tcpip-internet:#ffc776;--tcpip-link:#cfb4ff;--tcpip-application-chip:#60b5ff;--tcpip-transport-chip:#9ddb70;--tcpip-internet-chip:#ffbd61;--tcpip-link-chip:#c3a2ff;}}</style><g font-family="Arial, sans-serif"><rect x="10" y="10" width="145" height="109" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><rect x="19" y="19" width="24" height="24" rx="7" fill="var(--tcpip-application-chip,#c2dfff)"/><text text-anchor="middle" x="31" y="37" font-size="17" fill="var(--tcpip-chip-ink,#142438)" font-weight="700">4</text><text x="19" y="64" font-size="17" fill="var(--tcpip-application,#205a98)" font-weight="700">Прикладной</text><text x="20" y="89" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">HTTP · DNS</text><text x="20" y="109" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Сообщение</text><rect x="165" y="10" width="145" height="109" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><rect x="174" y="19" width="24" height="24" rx="7" fill="var(--tcpip-transport-chip,#d1ebba)"/><text text-anchor="middle" x="186" y="37" font-size="17" fill="var(--tcpip-chip-ink,#142438)" font-weight="700">3</text><text x="174" y="64" font-size="17" fill="var(--tcpip-transport,#355e23)" font-weight="700">Транспортный</text><text x="175" y="89" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">TCP: сегмент</text><text x="175" y="109" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">UDP: датаграмма</text><rect x="10" y="129" width="145" height="109" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><rect x="19" y="138" width="24" height="24" rx="7" fill="var(--tcpip-internet-chip,#ffe4b4)"/><text text-anchor="middle" x="31" y="156" font-size="17" fill="var(--tcpip-chip-ink,#142438)" font-weight="700">2</text><text x="19" y="183" font-size="17" fill="var(--tcpip-internet,#7c4607)" font-weight="700">Межсетевой</text><text x="20" y="208" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">IPv4 / IPv6</text><text x="20" y="228" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">IP-пакет</text><rect x="165" y="129" width="145" height="109" rx="12" fill="var(--tcpip-panel,#edf3fa)"/><rect x="174" y="138" width="24" height="24" rx="7" fill="var(--tcpip-link-chip,#e4d7ff)"/><text text-anchor="middle" x="186" y="156" font-size="17" fill="var(--tcpip-chip-ink,#142438)" font-weight="700">1</text><text x="174" y="183" font-size="17" fill="var(--tcpip-link,#624292)" font-weight="700">Сетевой доступ</text><text x="175" y="208" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Ethernet / Wi-Fi</text><text x="175" y="228" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="400">Кадр</text><text x="12" y="264" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="700">Отправка: 4 → 3 → 2 → 1</text><text x="12" y="287" font-size="16" fill="var(--tcpip-ink,#192d43)" font-weight="700">Приём: 1 → 2 → 3 → 4</text></g></svg>
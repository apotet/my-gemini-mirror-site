<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 337" role="img" aria-labelledby="t"><title id="t">Уровни TCP/IP: при отправке 4 → 1, при приёме 1 → 4</title><rect width="320" height="337" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><rect x="10" y="10" width="145" height="109" rx="12" fill="#13273e"/><rect x="19" y="19" width="24" height="24" rx="7" fill="#60b5ff"/><text text-anchor="middle" x="31" y="37" font-size="17" fill="#091728" font-weight="700">4</text><text x="19" y="64" font-size="17" fill="#60b5ff" font-weight="700">Прикладной</text><text x="20" y="89" font-size="16" fill="#eaf1ff" font-weight="400">HTTP · DNS</text><text x="20" y="109" font-size="16" fill="#eaf1ff" font-weight="400">Сообщение</text><rect x="165" y="10" width="145" height="109" rx="12" fill="#13273e"/><rect x="174" y="19" width="24" height="24" rx="7" fill="#9ddb70"/><text text-anchor="middle" x="186" y="37" font-size="17" fill="#091728" font-weight="700">3</text><text x="174" y="64" font-size="17" fill="#9ddb70" font-weight="700">Транспортный</text><text x="175" y="89" font-size="16" fill="#eaf1ff" font-weight="400">TCP: сегмент</text><text x="175" y="109" font-size="16" fill="#eaf1ff" font-weight="400">UDP: датаграмма</text><rect x="10" y="129" width="145" height="109" rx="12" fill="#13273e"/><rect x="19" y="138" width="24" height="24" rx="7" fill="#ffbd61"/><text text-anchor="middle" x="31" y="156" font-size="17" fill="#091728" font-weight="700">2</text><text x="19" y="183" font-size="17" fill="#ffbd61" font-weight="700">Межсетевой</text><text x="20" y="208" font-size="16" fill="#eaf1ff" font-weight="400">IPv4 / IPv6</text><text x="20" y="228" font-size="16" fill="#eaf1ff" font-weight="400">IP-пакет</text><rect x="165" y="129" width="145" height="109" rx="12" fill="#13273e"/><rect x="174" y="138" width="24" height="24" rx="7" fill="#c3a2ff"/><text text-anchor="middle" x="186" y="156" font-size="17" fill="#091728" font-weight="700">1</text><text x="174" y="183" fo
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 957" role="img" aria-labelledby="t"><title id="t">Итоговая шпаргалка TCP/IP: роли, адресация и направление обработки</title><rect width="320" height="957" rx="18" fill="#091728"/><g font-family="Arial, sans-serif"><text x="20" y="30" font-size="18" fill="#eaf1ff" font-weight="700">Вся модель на одной странице</text><rect x="10" y="50" width="300" height="178" rx="12" fill="#13273e"/><text x="22" y="78" font-size="18" fill="#60b5ff" font-weight="700">4 · Прикладной</text><text x="22" y="107" font-size="15" fill="#eaf1ff" font-weight="400">Задача: сообщения приложений</text><text x="22" y="135" font-size="15" fill="#eaf1ff" font-weight="400">HTTP/HTTPS · DNS · DHCP</text><text x="22" y="159" font-size="15" fill="#eaf1ff" font-weight="400">SMTP · FTP · SNMP</text><text x="22" y="183" font-size="15" fill="#eaf1ff" font-weight="400">Данные: сообщение</text><text x="22" y="209" font-size="15" fill="#60b5ff" font-weight="400">Адресация: имена и ресурсы</text><rect x="10" y="240" width="300" height="178" rx="12" fill="#13273e"/><text x="22" y="268" font-size="18" fill="#9ddb70" font-weight="700">3 · Транспортный</text><text x="22" y="297" font-size="15" fill="#eaf1ff" font-weight="400">Задача: доставка программам</text><text x="22" y="325" font-size="15" fill="#eaf1ff" font-weight="400">TCP / UDP · номера портов</text><text x="22" y="349" font-size="15" fill="#eaf1ff" font-weight="400">TCP: сегмент · UDP: датаграмма</text><text x="22" y="373" font-size="15" fill="#eaf1ff" font-weight="400">Работает в конечных узлах</text><text x="22" y="399" font-size="15" fill="#9ddb70" font-weight="400">Адресация: порты</text><rect x="10" y="430" width="300" height="178" rx="12" fill="#13273e"/><text x="22" y="458" font-size="18" fill="#ffbd61" font-weight="700">2 · Межсетевой</text><text x="22" y="487" font-size="15" fill="#eaf1ff" font-weight="400">Задача: доставка между сетями</text><text x="22" y="515" font-size="15" fill="#eaf1ff" font-weight="400">IPv4 / IPv6 · ICMP</text><text x="22" y="539" font-size="15" fill="#eaf1ff" font-weight="400">Данные: IP-пакет</text><text x="22" y="563" font-size="15" fill="#eaf1ff" font-weight="400">Адреса: IP · маршрутизатор</text><text x="22" y="589" font-size="15" fill="#ffbd61" font-weight="400">Адресация: IP</text><rect x="10" y="620" width="300" height="178" rx="12" fill="#13273e"/><text x="22" y="648" font-size="18" fill="#c3a2ff" font-weight="700">1 · Сетевой доступ</text><text x="22" y="677" font-size="15" fill="#eaf1ff" font-weight="400">Задача: местная передача</text><text x="22" y="705" font-size="15" fill="#eaf1ff" font-weight="400">Ethernet / Wi-Fi · MAC</text><text x="22" y="729" font-size="15" fill="#eaf1ff" font-weight="400">Данные: кадр → биты → сигналы</text><text x="22" y="753" font-size="15" fill="#eaf1ff" font-weight="400">Карта, коммутатор, кабель</text><text x="22" y="779" font-size="15" fill="#c3a2ff" font-weight="400">Адресация: MAC на канале</text><text x="20" y="834" font-size="16" fill="#eaf1ff" font-weight="400">↓ Отправка: данные → сегмент →</text><text x="20" y="860" font-size="16" fill="#eaf1ff" font-weight="400">пакет → кадр → сигналы</text><text x="20" y="898" font-size="16" fill="#eaf1ff" font-weight="400">↑ Приём: в обратном порядке</text></g></svg>